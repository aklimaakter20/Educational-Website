  <!-- about-section -->
  <div class="container mt-5">
    <div class="about-content">
      <div class="row justify-content-between contact-row ">
        <div class="col-lg-6 ">
          <form class="contact-form ">
            <h3 class="contact-heading ">Get In Touch</h3>

            <div class="mb-3">
              <label for="exampleInputEmail1" class="form-label">Full Name</label>
              <input type="text" class="form-control">

            </div>
            <div class="mb-3">
              <label for="exampleInputEmail1" class="form-label">Email address</label>
              <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp">
              <div id="emailHelp" class="form-text">We'll never share your email with anyone else.</div>
            </div>
            <div class="mb-3">
              <label for="exampleInputSubject" class="form-label">Subject</label>
              <input type="text" class="form-control" id="exampleInputSubject">
            </div>
            <div class="form-floating mb-3">
              <textarea class="form-control" placeholder="write your comment" id="floatingTextarea2"
                style="height: 100px"></textarea>
              <label for="floatingTextarea2">Comments</label>
            </div>
            <div class="mb-3 form-check">
              <input type="checkbox" class="form-check-input" id="exampleCheck1">
              <label class="form-check-label" for="exampleCheck1">Check me out</label>
            </div>
            <button type="submit" class="btn btn-primary">Send</button>
          </form>
        </div>
        <div class="col-lg-6  mt-5">
          <h5>Contact</h5>
          <div class="contact-section">


            <div class="contact-item">
              <div class="icon-box"><i class="bi bi-geo-alt-fill"></i></div>
              <p><strong>Address:</strong> 198 West 21th Street, Suite 721 New York NY 10016</p>
            </div>

            <div class="contact-item">
              <div class="icon-box"><i class="bi bi-telephone-fill"></i></div>
              <p><strong>Phone:</strong> + 1235 2355 98</p>
            </div>

            <div class="contact-item">
              <div class="icon-box"><i class="bi bi-envelope"></i>
              </div>
              <p><strong>Email:</strong> info@yoursite.com</p>
            </div>

            <div class="contact-item">
              <div class="icon-box"><i class="bi bi-browser-chrome"></i>
              </div>
              <p><strong>Website</strong> yoursite.com</p>
            </div>

            <div class="social-icon d-flex gap-3 ">
              <i class="bi bi-instagram"></i>
              <i class="bi bi-twitter"></i>
              <i class="bi bi-facebook"></i>
              <i class="bi bi-youtube"></i>

            </div>
          </div>
